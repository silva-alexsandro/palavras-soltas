<!DOCTYPE html>
<html lang="pt-br">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
   href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,700;0,800;1,300&display=swap"
   rel="stylesheet"
  />
  <title>Palavras Soltas</title>
  <link
   rel="shortcut icon"
   href="./img/favicon/favicon.ico"
   type="image/x-icon"
  />
 </head>
 <body>
  <header>
   <img src="./img/favicon/favicon.ico" alt="" />
   <h1>Palavras Soltas</h1>
  </header>
  <main>
   <section>
    <p class="subtitle">Um espaço para colocar tudo para fora...</p>
   </section>

   <section id="js-mural" class="mural"></section>
  </main>
  <!-- Modal -->
  <div class="modal-overlay" id="modal">
   <div
    id="js-modal-content"
    class="modal-content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    tabindex="-1"
   >
    <button class="modal-close" id="modal-close" aria-label="Fechar modal">
     &times;
    </button>
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
    <p id="modal-autor"></p>
   </div>
  </div>
  <script src="./js/main.js" defer></script>
 </body>
</html>
